<!--
    Ce fichier est un "partiel" : un petit bout de template réutilisé à
    plusieurs endroits (page d'accueil et page des favoris) pour afficher
    la vignette d'une recette. La variable "recette" doit être fournie par
    le template qui l'inclut.
-->
<div class="carte-recette">
    <form action="{{ url_for('basculer_favori', recipe_id=recette['id']) }}" method="post" class="bouton-favori-form">
        <button type="submit" class="bouton-favori" title="Ajouter ou retirer des favoris">
            {% if recette['favori'] %}❤️{% else %}🤍{% endif %}
        </button>
    </form>

    <a href="{{ url_for('detail', recipe_id=recette['id']) }}" class="lien-carte">
        <h3>{{ recette['titre'] }}</h3>
        <p class="categorie-badge">{{ recette['categorie'] }}</p>
        <p class="temps-info">
            ⏱️ {{ recette['temps_preparation'] + recette['temps_cuisson'] }} min
            · 👥 {{ recette['nombre_personnes'] }} pers.
        </p>
    </a>
</div>
